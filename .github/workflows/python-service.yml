# model-runtime(Python) 공통 CI (재사용 워크플로)
# pyproject.toml에 dev 의존성으로 ruff, mypy, pytest, pytest-cov가 있어야 한다.
# 모델 가중치는 테스트에서 가짜 객체로 대체한다 (GPU 없이 CI).
name: python-service

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      package:
        description: 커버리지를 잴 패키지 이름
        type: string
        required: true
      python-version:
        type: string
        default: '3.12'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy ${{ inputs.package }}
      - name: Test + coverage 80%
        run: pytest --cov=${{ inputs.package }} --cov-report=term-missing --cov-fail-under=80

  # GPU PC는 docker compose로 운영하므로 k8s 태그 갱신은 없다. 이미지만 만든다.
  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
