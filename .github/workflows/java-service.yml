# Spring 서비스 공통 CI (재사용 워크플로)
# 각 서비스 레포의 .github/workflows/ci.yml 이 `uses: 4cut-story/common/.github/workflows/java-service.yml@main` 으로 부른다.
#
# 흐름: 정적 분석 → 테스트(verify) → [main push일 때만] 이미지 빌드·푸시(:sha) → deploy 레포 이미지 태그 갱신
# crowfoot-auth CI를 참고했고, 바꾼 점은 common/README.md "CI" 절에 적었다.
name: java-service

on:
  workflow_call:
    inputs:
      app-name:
        description: 서비스 이름 (= 레포 이름 = deploy/k8s/apps/<app-name>)
        type: string
        required: true
      deploy:
        description: main push일 때 deploy 레포 이미지 태그를 갱신할지
        type: boolean
        default: true
    secrets:
      DEPLOY_REPO_TOKEN:
        description: 4cut-story/deploy contents 쓰기 권한 토큰 (deploy=true일 때 필요)
        required: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # 정적 분석(SpotBugs·FindSecBugs·PMD·CPD). 위반이 있으면 여기서 멈춘다.
      - name: Static analysis
        run: ./mvnw -B -ntp compile spotbugs:check pmd:check pmd:cpd-check
      # 테스트는 머지 조건이다 (constitution V). 단위·슬라이스·Testcontainers·JaCoCo 80% 검사를 verify에서 돌린다.
      - name: Test
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # latest 태그는 쓰지 않는다. 떠 있는 이미지가 어느 커밋인지 항상 sha로 알 수 있게 한다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy-tag:
    needs: image
    if: inputs.deploy && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: 4cut-story/common/.github/workflows/deploy-tag.yml@main
    with:
      app-name: ${{ inputs.app-name }}
    secrets:
      DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
