# Spring 서비스 공통 CI (재사용 워크플로)
# 각 서비스 레포의 .github/workflows/ci.yml 이 `uses: 4cut-story/common/.github/workflows/java-service.yml@main` 으로 부른다.
#
# 흐름: 코드 유무 확인(detect) → 정적 분석 → 테스트(verify) → [main push일 때만] 이미지 빌드·푸시(:sha)
# deploy 레포 이미지 태그는 deploy 레포의 sync-images 워크플로가 가져간다. 서비스 레포에 쓰기 토큰이 필요 없다.
# crowfoot-auth CI를 참고했고, 바꾼 점은 common/README.md "CI" 절에 적었다.
name: java-service

on:
  workflow_call:
    inputs:
      app-name:
        description: 서비스 이름 (= 레포 이름 = deploy/k8s/apps/<app-name>)
        type: string
        required: true
    secrets:
      DEPLOY_REPO_TOKEN:
        description: deploy 레포 sync-images를 바로 실행할 토큰 (fine-grained, deploy 레포 Actions 쓰기). 없으면 10분 폴링으로 반영
        required: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name }}

jobs:
  # 코드가 아직 없는 레포(스펙 단계)나 Dockerfile만 바뀐 경우에는 검사를 건너뛴다.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f pom.xml ] && [ -f mvnw ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pom.xml 또는 mvnw 없음. 코드가 생기기 전이라 검사를 건너뜀"
          fi

  verify:
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # setup-java가 만드는 settings.xml의 server 'github'는 env GITHUB_TOKEN을 비밀번호로 읽는다.
    # GitHub Packages(Maven)는 공개 패키지도 인증이 필요하므로 parent POM을 받으려면 꼭 넘긴다.
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # 정적 분석(SpotBugs·FindSecBugs·PMD·CPD). 위반이 있으면 여기서 멈춘다.
      - name: Static analysis
        run: ./mvnw -B -ntp compile spotbugs:check pmd:check pmd:cpd-check
      # 테스트는 머지 조건이다 (constitution V). 단위·슬라이스·Testcontainers·JaCoCo 80% 검사를 verify에서 돌린다.
      - name: Test
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # latest 태그는 쓰지 않는다. 떠 있는 이미지가 어느 커밋인지 항상 sha로 알 수 있게 한다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  # 이미지가 올라가면 deploy 레포 sync-images를 바로 깨워 이 서비스 태그를 갱신한다.
  # 토큰이 없거나 실패해도 deploy 레포의 10분 폴링이 같은 일을 하므로 빌드는 실패시키지 않는다.
  notify-deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::DEPLOY_REPO_TOKEN 없음. deploy 레포 폴링(10분)으로 반영됨"
            exit 0
          fi
          gh workflow run sync-images.yml -R "${{ github.repository_owner }}/deploy" \
            -f app="${{ inputs.app-name }}" -f sha="${{ github.sha }}" \
            || echo "::warning::sync-images 호출 실패. 폴링으로 반영됨"
