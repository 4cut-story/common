# web(Next.js) 공통 CI (재사용 워크플로)
# 서비스 레포 package.json에 아래 스크립트가 있어야 한다:
#   lint          ESLint (--max-warnings=0, 경고도 실패)
#   typecheck     tsc --noEmit
#   format:check  prettier --check .
#   dup:check     jscpd (중복 코드)
#   test:coverage Vitest, lines/branches/functions/statements 80% threshold
#   build         next build
name: node-service

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
    secrets:
      DEPLOY_REPO_TOKEN:
        description: deploy 레포 sync-images를 바로 실행할 토큰 (fine-grained, deploy 레포 Actions 쓰기). 없으면 10분 폴링으로 반영
        required: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name }}

jobs:
  # 코드가 아직 없는 레포(스펙 단계)나 Dockerfile만 바뀐 경우에는 검사를 건너뛴다.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ] && [ -f package-lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json 또는 package-lock.json 없음. 코드가 생기기 전이라 검사를 건너뜀"
          fi

  verify:
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run dup:check
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  # 이미지가 올라가면 deploy 레포 sync-images를 바로 깨워 이 서비스 태그를 갱신한다.
  # 토큰이 없거나 실패해도 deploy 레포의 10분 폴링이 같은 일을 하므로 빌드는 실패시키지 않는다.
  notify-deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::DEPLOY_REPO_TOKEN 없음. deploy 레포 폴링(10분)으로 반영됨"
            exit 0
          fi
          gh workflow run sync-images.yml -R "${{ github.repository_owner }}/deploy" \
            -f app="${{ inputs.app-name }}" -f sha="${{ github.sha }}" \
            || echo "::warning::sync-images 호출 실패. 폴링으로 반영됨"
