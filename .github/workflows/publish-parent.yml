# 태그 vX.Y.Z를 push하면 parent POM을 GitHub Packages에 배포한다.
# 태그 버전과 parent-pom/pom.xml의 <version>, <fourcut.common.version>이 같아야 한다.
name: publish-parent

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Check version matches tag
        working-directory: parent-pom
        run: |
          v=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "pom $v != tag $GITHUB_REF_NAME"; exit 1; }
      - name: Deploy
        working-directory: parent-pom
        run: mvn -B -ntp deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
