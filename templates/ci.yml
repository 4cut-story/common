# Spring 서비스 레포 .github/workflows/ci.yml 템플릿. SERVICE_NAME을 바꾼다.
# 코드가 바뀔 때만 돈다. pom.xml·mvnw가 없으면(스펙 단계) 재사용 워크플로의 detect 잡이 검사를 건너뛴다.
name: ci

on:
  pull_request:
    paths: [pom.xml, 'src/**', '.mvn/**', Dockerfile]
  push:
    branches: [main]
    paths: [pom.xml, 'src/**', '.mvn/**', Dockerfile]

jobs:
  ci:
    uses: 4cut-story/common/.github/workflows/java-service.yml@main
    with:
      app-name: SERVICE_NAME
    secrets:
      DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
    permissions:
      contents: read
      packages: write
