# 라이브 모드 계약 (docs 레포 specs/003-live-mode). 재생 정보 스키마와 조회 API.
openapi: 3.1.0
info:
  title: 4cut live mode
  version: 0.1.0
  description: >
    만화 한 편을 컷 슬라이드·컷별 배경음·두 장 움직임으로 재생하는 정보.
    conversation-service가 만들어 content-service 만화 등록(POST /internal/comics, 본문 live)으로 넘기고,
    content-service가 만화와 같은 공개 범위로 내준다. web은 이 JSON만 읽고 재생한다.
paths:
  /api/v1/comics/{id}/live:
    get:
      summary: 내 만화의 재생 정보
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 재생 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivePlayback' }
        '404':
          description: 남의 만화이거나 재생 정보가 없다(예전 만화)
  /api/v1/posts/{id}/live:
    get:
      summary: 볼 수 있는 게시물의 재생 정보
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 재생 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivePlayback' }
        '404':
          description: 볼 수 없는 게시물이거나 재생 정보가 없다
  /api/v1/comics/{id}/image:
    get:
      summary: 만화 이미지 사전 서명 주소. panel을 주면 그 컷 그림(말풍선 포함)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Panel'
        - $ref: '#/components/parameters/Frame'
      responses:
        '200': { description: '{url, expiresIn}' }
        '400': { description: panel과 cast를 함께 줬거나 frame이 a, b가 아니다 }
        '404': { description: 그 컷 그림이 재생 정보에 없다 }
  /api/v1/posts/{id}/image:
    get:
      summary: 게시물 이미지 사전 서명 주소. panel·frame은 comics와 같다
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Panel'
        - $ref: '#/components/parameters/Frame'
      responses:
        '200': { description: '{url, expiresIn}' }
        '404': { description: 볼 수 없거나 그 컷 그림이 없다 }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: './schemas/common.yaml#/components/schemas/PublicId' }
    Panel:
      name: panel
      in: query
      schema: { type: integer, minimum: 1, maximum: 10 }
    Frame:
      name: frame
      in: query
      schema: { type: string, enum: [a, b], default: a }
  schemas:
    LivePlayback:
      type: object
      required: [version, panels]
      description: 모르는 필드는 무시한다. 형식을 바꾸면 version을 올린다.
      properties:
        version: { type: integer, const: 1 }
        panels:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/LivePanel' }
    LivePanel:
      type: object
      required: [index, role, image, durationMs]
      properties:
        index: { type: integer, minimum: 1, maximum: 10, description: 보여 줄 순서 (1부터) }
        role: { type: string, enum: [기, 승, 전, 결] }
        image: { $ref: '#/components/schemas/PanelImage' }
        durationMs: { type: integer, minimum: 1000, maximum: 20000 }
        sound:
          oneOf:
            - $ref: '#/components/schemas/PanelSound'
            - type: 'null'
        motion:
          oneOf:
            - $ref: '#/components/schemas/PanelMotion'
            - type: 'null'
    PanelImage:
      type: string
      pattern: '^panels/([1-9]|10)(-b)?\.png$'
      description: 만화 폴더 기준 상대 경로. 화면은 panel 번호와 frame(a, b)으로 이미지 경로를 부른다.
    PanelSound:
      type: object
      required: [publicId, title, volume, fadeMs, loop]
      properties:
        publicId: { $ref: './schemas/common.yaml#/components/schemas/PublicId' }
        title: { type: string }
        volume: { type: number, minimum: 0, maximum: 1 }
        fadeMs: { type: integer, minimum: 0, maximum: 5000 }
        loop: { type: boolean }
        credit:
          type: object
          description: 저작자 표시. 화면은 license가 CC-BY로 시작할 때 보여 준다.
          properties:
            author: { type: string }
            license: { type: string, examples: [CC0-1.0, CC-BY-4.0] }
            licenseUrl: { type: string }
            sourceUrl: { type: string }
            originalTitle: { type: [string, 'null'] }
    PanelMotion:
      type: object
      required: [type, frames, intervalMs]
      properties:
        type: { type: string, enum: [twinkle, rain, snow, flicker, shimmer, petals] }
        frames:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/PanelImage' }
        intervalMs: { type: integer, minimum: 100, maximum: 5000 }
        easing: { type: string, default: ease-in-out }
