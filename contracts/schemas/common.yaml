# 공통 스키마 (docs 레포 docs/api-conventions.md v0.1)
# 각 서비스 OpenAPI에서 $ref: './schemas/common.yaml#/components/...' 로 가져다 쓴다.
openapi: 3.1.0
info:
  title: 4cut common schemas
  version: 0.1.0
  description: 오류 형식, 커서 페이지, 공통 헤더·파라미터. 개별 API는 없다.
paths: {}
components:
  schemas:
    PublicId:
      type: string
      pattern: '^[A-Za-z0-9_-]{21}$'
      description: 공개 ID (NanoID 21자). 서버가 만든다. DB 기본 키(BIGINT)는 밖에 내보내지 않는다.
      examples: ["V1StGXR8_Z5jdHi6B-myT"]
    Instant:
      type: string
      format: date-time
      description: ISO 8601, UTC, Z 표기, 밀리초까지.
      examples: ["2026-10-31T14:26:17.123Z"]
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: 오류 코드 (api-conventions.md 5절). 클라이언트는 이 값으로 분기한다.
          examples: [VALIDATION_FAILED]
        message:
          type: string
          description: 사용자에게 그대로 보여 줄 수 있는 한 문장. 내부 정보를 넣지 않는다.
          examples: ["입력값을 확인해 주세요."]
        traceId:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: X-Trace-Id와 같은 값.
        details:
          type: array
          description: VALIDATION_FAILED일 때만. 필드별 사유.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          description: 요청 본문의 필드 경로 (예 caption, panels[0].text)
        reason:
          type: string
          description: 사용자에게 보여 줄 수 있는 사유
    CursorPage:
      type: object
      description: |
        커서 페이지 응답의 공통 모양. 각 서비스는 allOf로 확장해 items의 타입을 정한다.
          allOf:
            - $ref: './schemas/common.yaml#/components/schemas/CursorPage'
            - properties: { items: { type: array, items: { $ref: '#/components/schemas/FeedItem' } } }
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: [string, 'null']
          description: 다음 페이지 커서. null이면 마지막 페이지.
    JobStatus:
      type: string
      description: model-runtime 비동기 작업 상태 (api-conventions.md 4절의 예외로 소문자).
      enum: [queued, running, succeeded, failed]
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: 앞 응답의 nextCursor. 첫 페이지는 생략.
      schema:
        type: string
    Size:
      name: size
      in: query
      required: false
      description: 한 번에 받을 개수
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: 게이트웨이가 붙이는 사용자 ID (JWT sub)
      schema:
        $ref: '#/components/schemas/PublicId'
    XUserRoles:
      name: X-User-Roles
      in: header
      required: false
      description: 게이트웨이가 붙이는 역할 목록, 쉼표 구분 (ROLE_MEMBER, ROLE_ADMIN)
      schema:
        type: string
        examples: ["ROLE_MEMBER,ROLE_ADMIN"]
    XTraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: 요청 추적 ID, 32자리 소문자 16진수
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
  headers:
    XTraceId:
      description: 요청 추적 ID (모든 응답)
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    WWWAuthenticate:
      description: 401 응답 (RFC 6750)
      schema:
        type: string
        examples: ['Bearer error="invalid_token"']
  responses:
    BadRequest:
      description: 요청 형식·값 오류 (VALIDATION_FAILED, MALFORMED_REQUEST, 도메인 코드)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 토큰 없음·위조 (UNAUTHORIZED) 또는 만료 (TOKEN_EXPIRED)
      headers:
        WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 역할 부족, 또는 볼 수 있는 리소스에 허용되지 않는 동작 (FORBIDDEN)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 없거나 볼 권한이 없는 리소스 (NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 현재 상태와 충돌 (CONFLICT 또는 도메인 코드)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: 서버 오류 (INTERNAL_ERROR, UPSTREAM_ERROR, SERVICE_UNAVAILABLE, UPSTREAM_TIMEOUT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
