# 서비스 이름·포트·주소의 원본 (docs/architecture.md 13절)
# compose, 매니페스트, 서비스 설정은 모두 이 이름과 포트를 쓴다.
# Java 패키지는 net.java21.fourcut.<서비스> (Java 패키지는 숫자로 시작하거나 '-'를 쓸 수 없어 4cut 대신 fourcut).
services:
  web:
    port: 3000
    location: cluster
    exposure: ingress
    prod_url: http://web:3000
    local_url: http://localhost:3000
  api-gateway:
    port: 8080
    location: cluster
    prod_url: http://api-gateway:8080
    java_package: net.java21.fourcut.gateway   # groupId net.java21.fourcut, artifactId api-gateway
    local_url: http://localhost:8080
    config_key: SERVICES_GATEWAY_URL   # web 서버 전용
  auth-service:
    port: 8080
    location: cluster
    prod_url: http://auth-service:8080
    java_package: net.java21.fourcut.auth   # groupId net.java21.fourcut, artifactId auth-service
    local_url: http://localhost:8081
    config_key: SERVICES_AUTH_URL
  conversation-service:
    port: 8080
    location: cluster
    prod_url: http://conversation-service:8080
    java_package: net.java21.fourcut.conversation   # groupId net.java21.fourcut, artifactId conversation-service
    local_url: http://localhost:8082
    config_key: SERVICES_CONVERSATION_URL
  content-service:
    port: 8080
    location: cluster
    prod_url: http://content-service:8080
    java_package: net.java21.fourcut.content   # groupId net.java21.fourcut, artifactId content-service
    local_url: http://localhost:8083
    config_key: SERVICES_CONTENT_URL
  model-runtime:            # GPU 워커. 클러스터에서 부르지 않는다 (pull, docs 아키텍처 8절)
    location: gpu-pc
    pulls_from: api-gateway   # /internal/gpu-jobs/** (conversation-service 워커 API)
    config_keys: [GPU_WORKER_API_URL, GPU_WORKER_TOKEN, OLLAMA_URL]   # 워커 쪽 설정
  ollama:
    port: 11434
    location: gpu-pc
    internal_url: http://ollama:11434   # GPU PC compose 안에서 워커만 호출
  postgresql:
    port: 5432
    location: existing-infra
    config_key: DB_URL                    # 실제 값은 local .env / prod Secret에만 둔다
    config_keys: [DB_URL, DB_USERNAME, DB_PASSWORD, DB_SCHEMA]
  minio:
    port: 9000
    location: existing-infra
    config_key: MINIO_ENDPOINT            # 키는 local .env / prod Secret에만 둔다
    config_keys: [MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY, MINIO_BUCKET]
    bucket: 4cut                          # MINIO_BUCKET
    prefixes: [audio-raw/, pipeline-work/, comics/, profile-images/]
  redis:
    port: 6379
    location: existing-infra
    phase: 2
    config_key: REDIS_URL
